---
# Replaces Dependabot. make deps-check updates Go modules, the Go toolchain
# and GitHub Actions to latest, runs go fix, and fails if that changed a file
# or govulncheck finds a reachable vulnerability. release.yml repeats it.
name: Dependencies

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  # Upstream releases and new advisories land without a push.
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check dependencies are latest and code is modernized
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make deps-check
