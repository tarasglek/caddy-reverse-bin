# make deps-check fails if dependencies, Go or Actions are behind, go fix has
# work, or govulncheck finds a reachable vulnerability.
name: Dependencies

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  # Upstream releases and new advisories land without a push.
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Check dependencies are latest and code is modernized
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make deps-check
