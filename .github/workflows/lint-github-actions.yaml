name: Lint GitHub Actions

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main, master]
    paths: [".github/workflows/**"]
  pull_request:
    branches: [main, master]
    paths: [".github/workflows/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - run: docker run --rm --network none -v "$PWD":/work:ro -w /work rhysd/actionlint:latest -shellcheck=

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      # Advisory only, so tag-pinned action refs stay low-maintenance.
      - run: docker run --rm --network none -v "$PWD":/work:ro ghcr.io/woodruffw/zizmor:latest --offline --no-exit-codes /work/.github/workflows
