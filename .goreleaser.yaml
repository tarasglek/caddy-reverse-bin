version: 2

# Run by .github/workflows/release.yml on v* tags.
project_name: caddy-reverse-bin

before:
  hooks:
    - go mod tidy

builds:
  - id: caddy-reverse-bin
    main: ./cmd/caddy
    binary: caddy-reverse-bin
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64
    ldflags:
      - >-
        -s -w
        -X github.com/caddyserver/caddy/v2.CustomVersion={{ .Version }}

archives:
  - id: binaries
    builds:
      - caddy-reverse-bin
    formats:
      - binary
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt
